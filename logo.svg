<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 130" width="100%" height="100%">
  <defs>
    <!-- Brand Gradients -->
    <linearGradient id="cf-master-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="30%" stop-color="#2563EB" />
      <stop offset="70%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <linearGradient id="cf-cyan-bright" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>

    <!-- Subtle Glow for Vector Icon -->
    <filter id="cf-master-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ==================== LOGO ICON MARK ==================== -->
  <g transform="translate(10, 5)">
    <!-- Primary Circular C & Sweeping Wave Spine -->
    <path d="M 68 46 
             C 61 32, 45 28, 33 37 
             C 19 47, 18 73, 31 88 
             C 43 102, 62 100, 71 88 
             C 78 79, 83 56, 92 46 
             C 99 39, 111 39, 120 39" 
          fill="none" 
          stroke="url(#cf-master-grad)" 
          stroke-width="9" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#cf-master-glow)" />

    <!-- Inner Wave Current Echo -->
    <path d="M 33 76 
             C 38 90, 55 95, 64 86 
             C 73 77, 79 61, 88 56" 
          fill="none" 
          stroke="url(#cf-master-grad)" 
          stroke-width="3.5" 
          stroke-linecap="round" 
          opacity="0.85" />

    <!-- Middle Crossbar of F -->
    <path d="M 83 65 
             C 90 63, 100 63, 112 63" 
          fill="none" 
          stroke="url(#cf-cyan-bright)" 
          stroke-width="8.5" 
          stroke-linecap="round" />
  </g>

  <!-- ==================== TYPOGRAPHY ==================== -->
  <g transform="translate(156, 0)">
    <!-- Main Wordmark: CivicFlow -->
    <text x="0" y="68" 
          font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', Roboto, sans-serif" 
          font-size="44" 
          font-weight="800" 
          letter-spacing="-1px" 
          fill="#FFFFFF">
      Civic<tspan fill="url(#cf-cyan-bright)">Flow</tspan>
    </text>

    <!-- Subline: TECHNOLOGIES -->
    <text x="2" y="96" 
          font-family="'JetBrains Mono', 'Fira Code', monospace" 
          font-size="13" 
          font-weight="600" 
          letter-spacing="5.5px" 
          fill="#94A3B8">
      TECHNOLOGIES
    </text>

    <!-- Category Pill Badge -->
    <rect x="200" y="82" width="144" height="20" rx="10" fill="rgba(6, 182, 212, 0.12)" stroke="rgba(6, 182, 212, 0.35)" stroke-width="1" />
    <text x="209" y="95.5" 
          font-family="'JetBrains Mono', monospace" 
          font-size="8.5" 
          font-weight="700" 
          letter-spacing="1.2px" 
          fill="#22D3EE">
      CIVIC SOFTWARE CRAFT
    </text>
  </g>
</svg>
