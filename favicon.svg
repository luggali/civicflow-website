<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Master Civic Cobalt to Electric Cyan Gradient -->
    <linearGradient id="cf-flow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="25%" stop-color="#2563EB" />
      <stop offset="65%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Vibrant Cyan Highlight for the Wing -->
    <linearGradient id="cf-wing-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>

    <!-- Subtle Glow for Dark Mode -->
    <filter id="cf-subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- The Pure Flow Monogram Geometry -->
  <g filter="url(#cf-subtle-glow)">
    <!-- Primary Circular C & Sweeping Wave Spine -->
    <!-- Starts at top-right of C, loops around bottom, sweeps up through the S-curve into top wing of F -->
    <path d="M 58 40 
             C 52 28, 38 24, 28 32 
             C 16 41, 15 63, 26 76 
             C 36 88, 52 86, 60 76 
             C 66 68, 70 48, 78 40 
             C 84 34, 94 34, 102 34" 
          fill="none" 
          stroke="url(#cf-flow-grad)" 
          stroke-width="7.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Lower Wave Current (Inner Arc Echo) -->
    <path d="M 28 66 
             C 32 78, 46 82, 54 74 
             C 62 66, 67 52, 74 48" 
          fill="none" 
          stroke="url(#cf-flow-grad)" 
          stroke-width="3" 
          stroke-linecap="round" 
          opacity="0.85" />

    <!-- Middle Crossbar of F (Aerodynamic Horizontal Stream) -->
    <path d="M 70 56 
             C 76 54, 84 54, 95 54" 
          fill="none" 
          stroke="url(#cf-wing-grad)" 
          stroke-width="7" 
          stroke-linecap="round" />
  </g>
</svg>
